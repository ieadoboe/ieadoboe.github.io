    projects:
      - name: 'MSc Thesis Research: Extreme Heatwave Storylines with Differentiable Climate Models'
        date:
        start_date: 2026-03
        end_date: present
        location:
        summary: Thesis research extending a published framework for constructing extreme heatwave storylines with differentiable climate models (Whittaker & Di Luca, 2026), using NeuralGCM and gradient-based optimization of atmospheric initial conditions.
        highlights:
          - 'Developed a modular Python research package (data, model, optimization, ensemble, evaluation, and plotting modules) in JAX with a reproducible experiment pipeline over ARCO-ERA5 reanalysis data (xarray, Zarr, Google Cloud Storage).'
          - 'Ran NeuralGCM lead-time sensitivity and ensemble hit-rate experiments on the August 2025 St. John''s heatwave to establish the lead time at which forecast skill for the event emerges.'
          - 'Built a multi-event heatwave atlas spanning 7 historical events across Köppen climate zones, including Moscow 2010, Pacific Northwest 2021, Japan 2018, Siberia 2020, Brazil 2023, and Sahel 2024.'
      - name: 'Surrogate-Based Optimization for Molecular Configurations'
        date: Spring 2025
        start_date: 2025-01
        end_date: 2025-08
        location:
        summary: Developed machine learning surrogates to replace expensive quantum chemistry calculations in protein-carbohydrate binding energy predictions, accelerating optimization
        highlights:
          - "Formulated surrogate modeling problem in 16-dimensional molecular configuration space. Trained 4 ML models (Random Forest, XGBoost, MLP, SVR) on 740 DFT-computed samples with 80/20 cross-validation and hyperparameter optimization."
          - "Implemented global optimization using Differential Evolution with trained surrogates as objective function approximations. Achieved speedup over direct quantum chemistry calculations while maintaining prediction accuracy for binding energy landscapes."
          - "Validated surrogate predictions against ground-truth DFT calculations. Analyzed model uncertainty quantification and explored multi-fidelity modeling approaches."
          # - '**Surrogate Modeling:** Developed 5 surrogate models (Random Forest, XGBoost, MERF, MLP, SVR) achieving 0.5 kcal/mol RMSE on SAPT energy predictions, reducing computational cost by 1000x compared to direct quantum chemistry calculations while maintaining chemical accuracy.'
          # - '**Global Optimization:** Implemented 3 optimization algorithms (L-BFGS-B, Differential Evolution, Bayesian Optimization) in factorial experimental design across 24 molecular pairs. Conducted 3,600 optimization experiments (3.6M surrogate evaluations) comparing surrogate-optimizer performance.'
          # - '**Feature Engineering:** Applied preprocessing pipeline for 16D mixed continuous-categorical input space (6 geometric features + 10 binary encoding). Implemented one-hot encoding for categorical variables and standardization for continuous features to improve model convergence.'
      - name: 'Fault Detection in Induction Motors using Deep Learning [*BlogPost*](https://ieadoboe.github.io/blog/fault-detection-in-induction-motors/motor-faults)'
        date: 'Jan - Aug 2021'
        start_date: 2021-01
        end_date: 2021-08
        location:
        summary: Developed CNN architecture for induction motor fault classification by extracting physics-informed features from current and vibration signals via time-frequency analysis.
        highlights:
          - "Designed signal processing pipeline converting raw sensor data into physics-informed spectrograms using Continuous Wavelet Transform (CWT). Extracted time-frequency representations capturing electromechanical fault signatures from 1,500 data points across 5 fault conditions."
          - "Built custom CNN (4 Conv2D layers, 64 filters) achieving 61.4% multi-class accuracy on motor fault classification using TensorFlow/Keras. Implemented data augmentation strategies to address limited experimental dataset constraints."
          - "Analyzed model interpretability by visualizing learned feature maps and correlating them with known physical fault mechanisms (bearing degradation, winding failures, phase imbalances)."
          # - '**Deep Learning Architecture:** Developed convolutional neural network achieving 61.4% multi-class classification accuracy on motor fault dataset (bearing faults, rotor faults, stator faults). Trained for 20 epochs using TensorFlow/Keras with Adam optimizer.'
          # - '**Signal Processing:** Processed motor current signals into 2D time-frequency spectrograms using Fast Fourier Transform (FFT) and short-time Fourier transform (STFT). Applied data augmentation (rotation, scaling, noise injection) to improve model generalization with limited training samples.'
          # - '**Research Delivery:** Presented thesis findings to faculty evaluation panel, demonstrating technical communication skills. Documented complete methodology, experimental results, and recommendations for industrial deployment of fault detection system.'
      - name: 'Fine-Tuned CodeGen Model [*GitHub*](https://github.com/ieadoboe/ai-code-autocompletion)'
        date: Winter 2025
        start_date: 2025-01
        end_date: 2025-04
        location:
        summary: Fine-tuned transformer-based CodeGen-350M on CodeSearchNet Python corpus using HuggingFace Transformers. Optimized training with GPU acceleration and evaluated using BLEU, CodeBLEU metrics for code completion quality.
        highlights:
          - "Trained on 2,700 samples (300 validation) with GPU acceleration. Implemented learning rate scheduling, warmup steps, and mixed-precision training for efficient convergence. Evaluated using BLEU and CodeBLEU metrics"
          # - '**Model Fine-Tuning:** Fine-tuned transformer-based CodeGen-350M model on CodeSearchNet Python corpus using HuggingFace Transformers. Developed preprocessing pipeline handling programming language syntax and abstract syntax tree (AST) structure for improved code understanding.'
          # - '**Training Optimization:** Optimized training hyperparameters (learning rate scheduling, batch size, warmup steps) using GPU acceleration. Implemented gradient accumulation and mixed-precision training to handle large batch sizes within memory constraints.'
          # - '**Evaluation Framework:** Implemented comprehensive evaluation metrics (BLEU, CodeBLEU, exact-match accuracy) to quantify code completion quality. Conducted ablation studies comparing different model sizes and training configurations.'

